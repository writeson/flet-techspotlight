[project]
name = "heatmap-data-generator"
version = "0.1.0"
description = "Payments heatmap data generator for the flet-techspotlight app"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.24",
]

# A script directory, not an installable package: `uv sync` installs only the
# dependencies into backend/tools/.venv and creates backend/tools/uv.lock.
[tool.uv]
package = false
