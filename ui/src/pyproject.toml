[project]
name = "flet-techspotlight"
version = "0.1.0"
description = "A Flet demonstration project for a Tech Spotlight"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.4",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
]

# A Flet app directory, not an installable package: `uv sync` installs only
# the dependencies into ui/src/.venv and creates ui/src/uv.lock.
[tool.uv]
package = false

[tool.flet]
org = "com.mycompany"
product = "flet-techspotlight"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

# Build output (flet build / flet test host) lands in ui/src/build/.
